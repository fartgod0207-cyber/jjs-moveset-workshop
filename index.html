<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jujutsu Shenanigans - Workshop Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4">

    <!-- In-Game Main Window Container -->
    <div class="w-full max-w-4xl bg-[#c2c2c2] border-4 border-[#555555] rounded-lg shadow-2xl overflow-hidden text-zinc-900 font-['Finger_Paint']">
        
        <!-- Top Tab Bar -->
        <div class="flex border-b-2 border-[#555555] bg-[#b0b0b0] text-sm select-none">
            <button onclick="switchTab('Movesets')" id="tab-Movesets" class="flex-1 py-2 text-center font-bold bg-[#c2c2c2] border-r-2 border-[#555555] transition">Movesets</button>
            <button onclick="switchTab('Maps')" id="tab-Maps" class="flex-1 py-2 text-center font-bold hover:bg-[#b8b8b8] border-r-2 border-[#555555] transition">Maps</button>
            <button onclick="switchTab('Favourites')" id="tab-Favourites" class="flex-1 py-2 text-center font-bold hover:bg-[#b8b8b8] border-r-2 border-[#555555] transition">Favourites</button>
            <button onclick="switchTab('Uploads')" id="tab-Uploads" class="flex-1 py-2 text-center font-bold hover:bg-[#b8b8b8] transition">Uploads</button>
        </div>

        <!-- Toolbar Section -->
        <div class="p-2.5 bg-[#d4d4d4] border-b-2 border-[#555555] flex flex-wrap items-center justify-between gap-2">
            <div class="flex-1 min-w-[200px]">
                <input type="text" id="searchInput" placeholder="Search..." onkeyup="filterCards()" 
                    class="w-full bg-white border-2 border-[#555555] px-3 py-1 text-sm rounded outline-none placeholder-zinc-500 text-zinc-800">
            </div>
            
            <div class="flex items-center gap-1 text-xs font-bold">
                <span id="resultCount" class="px-2 text-zinc-700">0 results</span>
                <button onclick="openCreateModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white border-2 border-[#555555] px-3 py-1 rounded transition">+ CREATE</button>
            </div>
        </div>

        <!-- Grid Container for Cards -->
        <div class="p-3 bg-[#b8b8b8] grid grid-cols-1 md:grid-cols-2 gap-3 min-h-[300px]" id="cardGrid">
            <!-- Dynamic Cards Go Here -->
        </div>

        <!-- Footer Bar -->
        <div class="bg-[#b0b0b0] border-t-2 border-[#555555] px-3 py-1.5 text-xs text-zinc-700 flex justify-between items-center">
            <span>Jujutsu Shenanigans Workshop Web Port</span>
            <span>Static Host Edition</span>
        </div>
    </div>

    <!-- Draggable Creation Modal Window -->
    <div id="createModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50">
        <div id="modalWindow" class="w-full max-w-md bg-[#c2c2c2] border-4 border-[#555555] rounded-lg shadow-2xl overflow-hidden text-zinc-900 font-['Finger_Paint'] absolute">
            
            <!-- Draggable Title Header Bar -->
            <div id="modalHeader" class="bg-[#a0a0a0] border-b-2 border-[#555555] p-2 flex justify-between items-center cursor-move select-none">
                <span class="font-bold text-sm">CREATE WORKSHOP ITEM</span>
                <button onclick="closeCreateModal()" class="bg-red-500 text-white px-2 py-0.5 rounded text-xs border border-red-700 font-bold hover:bg-red-600">X</button>
            </div>

            <!-- Creation Form -->
            <form onsubmit="handleCreateSubmit(event)" class="p-4 flex flex-col gap-3 text-xs">
                <div>
                    <label class="block mb-1 font-bold">Category</label>
                    <select id="newCategory" class="w-full bg-white border-2 border-[#555555] p-1.5 rounded outline-none">
                        <option value="Movesets">Movesets</option>
                        <option value="Maps">Maps</option>
                    </select>
                </div>

                <div>
                    <label class="block mb-1 font-bold">Title</label>
                    <input type="text" id="newTitle" required placeholder="Item title..." class="w-full bg-white border-2 border-[#555555] p-1.5 rounded outline-none">
                </div>

                <div>
                    <label class="block mb-1 font-bold">Code / Import ID</label>
                    <input type="text" id="newId" required placeholder="JJS-XXXX-XXXX" class="w-full bg-white border-2 border-[#555555] p-1.5 rounded outline-none">
                </div>

                <div>
                    <label class="block mb-1 font-bold">Creator Name</label>
                    <input type="text" id="newAuthor" required placeholder="Your username..." class="w-full bg-white border-2 border-[#555555] p-1.5 rounded outline-none">
                </div>

                <div>
                    <label class="block mb-1 font-bold">Description</label>
                    <textarea id="newDescription" rows="2" placeholder="Brief details about your setup..." class="w-full bg-white border-2 border-[#555555] p-1.5 rounded outline-none"></textarea>
                </div>

                <div class="flex gap-2 justify-end mt-2">
                    <button type="button" onclick="closeCreateModal()" class="bg-[#b0b0b0] hover:bg-[#a0a0a0] border-2 border-[#555555] px-3 py-1.5 rounded font-bold">Cancel</button>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white border-2 border-[#555555] px-4 py-1.5 rounded font-bold">Add Item</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
